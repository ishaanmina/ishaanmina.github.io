          - "Coursework: Design and Implementation of Analogue Circuits, Semiconductor Devices, Technology of Integrated Systems, Reliability and Yield, Physical Material Characterization, MEMS and Microsystems"

      - institution: Indian Institute of Technology Delhi
        location: New Delhi, India
        area: Engineering Physics, with a focus on Electrical Engineering
        studyType: BTech
        start_date: Nov 2020
        end_date: May 2024
        highlights:
          - "First Class, 73%"
          - "Thesis: Design and Simulation of Single Photon Avalanche Diodes (SPADs)"
          - "Coursework: Computer Architecture, Introduction to VLSI, Physical Electronics, Signals and Systems, Digital Electronics, Design of Digital Integrated Circuits, Analog and Mixed-Signal Electronics, Solid State Physics, Quantum Mechanics, Electrodynamics, Statistical Physics"

    Experience:
      - company: imec — Interuniversity Microelectronics Centre
        position: Student Intern (DTCO), continuing as Master's Thesis Researcher
        location: Leuven, Belgium
        start_date: Jul 2025
        end_date: Aug 2026
        summary: "Design-Technology Co-Optimization for advanced CFET logic — 3D TCAD simulation, parasitic extraction, and compact modelling. Device performance and PPA outcomes are under NDA; the tooling and methodology below are not."
        highlights:
          - "Simulated 3D device structures in Synopsys TCAD and generated electrical models for logic standard cells."
          - "Fully parametrised the CFET structure across 43 geometric and design parameters, and built a custom script to sweep 15+ core parameters including multi-parameter combined sweeps."
          - "Wrote Python automation that computes parasitic capacitance directly from device dimensions, ingesting Synopsys sVisual TCAD logs or a user-defined device with nominated capacitance surfaces, and emits a SPICE netlist."
          - "Applied the Kron reduction network method to collapse the parasitic network to input/output/node capacitances, holding individual capacitances to under 10% error."
          - "Developed an analytical compact model of CFET parasitic capacitances producing a PDK-ready SPICE netlist."
          - "Built an in-house TCAD log-file viewer and renderer in Python to replace the CPU/GPU-heavy native viewer — added slicing, per-layer hide/show, opacity control and surface highlighting, and rendered substantially faster."

      - company: Tata Institute of Fundamental Research (TIFR)
        position: Intern, Opto-Mechanical Instrument Engineer
        location: Mumbai, India
        start_date: Jun 2023
        end_date: Jul 2023
        summary: "Precision optomechanical design and error-budget analysis for the TA-MOONS pick-up arm, a multi-object spectrometer mechanism for the 3.6 m Devasthal Optical Telescope. Contributing author on the resulting SPIE 2024 paper."
        highlights:
          - "Designed the robotic pick-up arm in SolidWorks; ran FEA in Ansys Mechanical for structural and thermal integrity."
          - "Achieved 16 µm and 5 µrad precision through error-budget design optimisation; ran FMEA and 5-whys on the mechanism and applied DFM so the required tolerances were manufacturable."
          - "Used Zemax to verify optical focus and movement, and MATLAB/Simulink for the control algorithm selecting which of 8 arms picks a 13 mm² area from a 10 m aperture field."

      - company: Rancho Labs
        position: Intern, Robotics Curriculum Designer and Instructor
        location: New Delhi, India
        start_date: Jun 2022
        end_date: Jul 2022
        summary: "Designed and taught an introductory robotics course from scratch to ~50 secondary and senior-secondary students."
        highlights:
          - "Covered electronics, mechanical systems and Arduino programming in C++, including digital and analogue peripherals."
          - "Built and taught through three projects: a piezoelectric speaker, an RF-controlled prosthetic arm (flex sensors, 433 MHz link, servos on a 3D-printed arm), and an autonomous trash collector with HC-05 Bluetooth/UART status reporting."

    Projects:
      - name: Optical NEMS-Based XOR Gate — imec course project (Feb – Jun 2025)
        url: /projects/optical-nems-xor-gate/
        summary: "Replicated a published NEMS structure and optimised it in COMSOL and MATLAB: 1550 nm operation, 0.8 µm plate displacement at 10 V controlling optical transmission."

      - name: Operational Telescopic Amplifier — MICAS, KU Leuven (Sep – Nov 2024)
        url: /projects/ota-analog-chip/
        summary: "Designed, taped out and measured a 180 nm OTA in Cadence Virtuoso/ADE: 87.65 dB gain, 1.23 MHz GBW, 1 mW at 1.8 V, 10 transistors. Silicon matched simulation within 1%."

      - name: Single Photon Avalanche Diodes — Bachelor Thesis, IIT Delhi (Aug 2023 – May 2024)
        url: /projects/spad-design-simulation/
        summary: "Silvaco Atlas TCAD design of silicon SPADs for NIR camera sensors, comparing planar and epitaxial structures. Reached 30% PDE at 800 nm (industry baseline ~50%) with −18.1 V breakdown."

      - name: 8-bit Vector Multiplication Microprocessor — Intro to VLSI, IIT Delhi (Aug – Nov 2023)
        url: /projects/vlsi-vector-multiplier/
        summary: "Behavioural Verilog through Cadence Genus synthesis and Innovus place-and-route, with static timing analysis and DRC."

      - name: Student-Led Rocketry Project — Physics and Astronomy Society, IIT Delhi (2023)
        url: /projects/rocketry-space-project/
        summary: "Laid the foundation for IIT Delhi's first student-led space project, instructing juniors on strain gauge instrumentation, static test bench design, KNO₃/sugar solid propellant characterisation, airframe alignment, and mass budgeting from 100 ft to 1000 ft targets."

      - name: Solar Corona Imaging — Total Solar Eclipse, Exmouth, Australia (Dec 2022 – Apr 2023)
        url: /projects/solar-eclipse-corona-2023/
        summary: "Equipment lead on a university-sponsored expedition. Designed and manufactured telescope mounts, dew-heater power banks and camera filters; captured 30 fps imagery across 4 telescopes with different capture algorithms through the ~2-minute totality."

      - name: 3D-Printed Quadcopter (Dec 2022)
        url: /projects/quadcopter-drone/
        summary: "211 g self-built drone with 200 g payload and ~30 min flight time — ESP32, 4× BLDC motors, 3D-printed frame, and a PID controller achieving stable flight."

      - name: Galaxy Rotation Curves with a Low-Cost 21 cm Radio Telescope (Sep – Dec 2022)
        url: /projects/radio-telescope-21cm/
        summary: "Built a custom horn antenna to detect the 1420.4 MHz hydrogen line; detected the signal centred on the Milky Way galactic plane, with precision constrained by receiver noise floor and aperture size."

      - name: XLR-20 Electric Racecar — Formula Student, AXLR8R Club, IIT Delhi (May 2021 – Jun 2022)
        url: /projects/formula-student-xlr20/
        summary: "Co-led the ~INR 10 million XLR-20 project in the Accumulator Department and mentored 50+ juniors. 3rd overall at Formula Bharat 2022; 2nd in Best Vehicle Design and Best Powertrain; design won a Tesla-sponsored competition."
        highlights:
          - "Designed and helped manufacture a 400 V lithium-ion pouch cell battery module with a passive BMS; cells vendor-selected and specified."
          - "Designed 2 PCBs — a per-cell sensing board replicated 8× to monitor all 192 cells, and a data-aggregation board feeding the vehicle control unit. Tested and debugged 20+ PCBs."
          - "Designed safety circuits in Altium, simulated in LTSpice; owned fuse specification from HPC fuses down to 0603 SMD; 50+ hours of cell capacity testing plotted in MATLAB."
          - "Ran FMEA on the accumulator and 5-whys root-cause analysis during board bring-up; designed a charging cart with tubular CAD and DFM principles; performed manufacturing-cost analysis for the Cost event."

      - name: RuTAG Smart Vending Cart — Rural Technology Development (Jul – Aug 2021)
        url: /projects/rutag-vending-cart/
        summary: "30+ on-ground vendor surveys translated into a modular cart-attachment specification; SolidWorks CAD for centre-of-mass and stability simulation; estimated 40–60% lower cost than commercial equivalents. Design phase complete."

      - name: Quantum Error Mitigation — IBM Qiskit Global Summer School (Mar 2021)
        url: /projects/qiskit-quantum-ml/
        summary: "Completed IBM's certified programme on quantum computing and QML; built an error-mitigation solution cutting computational error from ~70% to under 10% on an arithmetic verification task. Later taught a 4-week Qiskit workshop series to ~15 bachelor students (2023)."

